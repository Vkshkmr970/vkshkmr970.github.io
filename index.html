<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vikash Kumar — Android Developer</title>
  <meta name="description" content="Vikash Kumar — Senior Android Developer (Kotlin, Jetpack, MVVM). Portfolio & resume." />
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#9aa4b2; --accent:#4f46e5; --glass: rgba(255,255,255,0.03);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue";
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#071025);color:#e6eef7;line-height:1.5}
    .container{max-width:1000px;margin:40px auto;padding:24px}
    header{display:flex;align-items:center;gap:16px}
    .avatar{width:96px;height:96px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:white}
    h1{margin:0;font-size:28px}
    p.lead{color:var(--muted);margin:6px 0 18px}
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
    .card{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .section-title{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
    .skills{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:13px;color:#dbeafe}
    .projects a{color:var(--accent);text-decoration:none}
    ul{margin:0;padding-left:18px}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,var(--accent),#06b6d4);color:white;text-decoration:none;font-weight:600}
    @media(max-width:880px){.grid{grid-template-columns:1fr}.container{margin:20px;padding:16px}.avatar{width:80px;height:80px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">VK</div>
      <div>
        <h1>Vikash Kumar</h1>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="color:var(--muted);font-size:13px">Senior Android Developer • 7+ years</div>
          <div style="font-size:13px;color:var(--muted)">| Based in India</div>
        </div>
        <p class="lead">Building performant Android & cross-platform apps with Kotlin, Jetpack Compose, MVVM, and clean architecture.</p>
      </div>
    </header>
  </div>
</body>
</html>
